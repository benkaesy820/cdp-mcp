<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Agent chat</title>
<style>
  /* Tokens declared once; nothing below reaches for a literal colour. */
  :root {
    --surface:      #14161a;
    --surface-2:    #1b1e23;
    --line:         #2a2f36;
    --text:         #e8eaed;
    --text-dim:     #9aa3ad;
    --you:          #24527a;
    --you-text:     #eaf2fa;
    --agent:        #24282e;
    --wait:         #e0a33e;   /* the agent is blocked on you */
    --work:         #6fa8dc;   /* queued, not yet read */
    --danger:       #d9736a;
    --radius:       12px;
    --step:         4px;

    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --surface:   #f6f7f9;
      --surface-2: #ffffff;
      --line:      #dde1e6;
      --text:      #16191d;
      --text-dim:  #5c6672;
      --you:       #24527a;
      --you-text:  #ffffff;
      --agent:     #e9edf2;
      --wait:      #9a6400;
      --work:      #2f6f9f;
      --danger:    #a33a30;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--surface);
    color: var(--text);
    font: 16px/1.5 var(--font);
    overflow-x: clip;              /* never a horizontal scrollbar */
    -webkit-text-size-adjust: 100%;
  }

  /* The app is a sheet on the desktop, not a column stranded in empty space.
     Full-bleed on a phone, where there is nothing to strand it in. */
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 760px;
    /* Grows with the conversation, up to the viewport. An empty panel is a
       sentence tall, which is what it has to say. */
    height: 100%;
    background: var(--surface);
  }

  .app[data-has-messages="false"] { height: auto; }
  .app[data-has-messages="false"] .log { flex: 0 0 auto; overflow: visible; }

  @media (min-width: 760px) {
    body { padding: calc(var(--step) * 6) calc(var(--step) * 4); }
    .app {
      height: 100%;
      max-height: 900px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;

    }
  }

  /* ---- the rail: the one memorable element ------------------------------ */
  /* It states a fact the server can prove — how much of the queue is unread —
     and never claims the agent is "online". */
  .rail {
    display: flex;
    align-items: center;
    gap: calc(var(--step) * 2);
    padding: calc(var(--step) * 3) calc(var(--step) * 4);
    padding-top: max(calc(var(--step) * 3), env(safe-area-inset-top));
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--text-dim);
    flex: 0 0 auto;
  }

  .rail .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--wait);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--wait) 22%, transparent);
  }

  .rail[data-state="queued"] .dot {
    background: var(--work);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--work) 22%, transparent);
  }

  .rail[data-state="idle"] .dot {
    background: var(--text-dim);
    box-shadow: none;
  }

  .rail .what { color: var(--text); font-weight: 600; }
  .title {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .rail .sep { width: 1px; height: 16px; background: var(--line); }
  .rail .meta { margin-left: auto; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  /* On a narrow screen the explanatory text is the first thing to go: the
     state word and the queue size already say it. */
  @media (max-width: 520px) {
    #rail-detail { display: none; }
  }

  /* ---- the conversation ------------------------------------------------- */
  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: calc(var(--step) * 4);
    display: flex;
    flex-direction: column;
    gap: calc(var(--step) * 2);
    scroll-behavior: smooth;
  }

  .row { display: flex; flex-direction: column; align-items: flex-start; }
  .row.you { align-items: flex-end; }

  .bubble {
    max-width: min(38ch, 82%);
    padding: calc(var(--step) * 3) calc(var(--step) * 4);
    border-radius: var(--radius);
    background: var(--agent);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 15px;
  }

  .row.you .bubble {
    background: var(--you);
    color: var(--you-text);
  }

  .stamp {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    padding: 2px var(--step) 0;
  }

  .bubble { max-width: min(38ch, 82%); }

  .empty {
    margin: 0;
    padding-top: calc(var(--step) * 6);
    color: var(--text-dim);
    font-size: 14px;
    max-width: 40ch;
    display: grid;
    gap: calc(var(--step) * 2);
  }

  /* `display: grid` would otherwise defeat the `hidden` attribute. */
  .empty[hidden] { display: none; }

  .empty p { margin: 0; }
  .empty-lead { color: var(--text); font-weight: 600; font-size: 15px; }

  .empty-facts {
    margin: 0;
    padding: calc(var(--step) * 3) 0 0;
    list-style: none;
    border-top: 1px solid var(--line);
    display: grid;
    gap: var(--step);
    font-size: 13px;
  }

  .empty-facts .k {
    display: inline-block;
    min-width: 12ch;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
  }

  /* ---- the composer ----------------------------------------------------- */
  .composer {
    flex: 0 0 auto;
    display: flex;
    gap: calc(var(--step) * 2);
    padding: calc(var(--step) * 3) calc(var(--step) * 4);
    padding-bottom: max(calc(var(--step) * 3), env(safe-area-inset-bottom));
    background: var(--surface-2);
    border-top: 1px solid var(--line);
  }

  .composer input {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 44px;
    padding: 0 calc(var(--step) * 3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 16px;                /* no zoom on iOS */
  }

  .composer input::placeholder { color: var(--text-dim); }

  .composer button {
    min-height: 44px;
    min-width: 44px;
    padding: 0 calc(var(--step) * 4);
    border: 0;
    border-radius: var(--radius);
    background: var(--you);
    color: var(--you-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .composer button.quiet {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    font-weight: 500;
  }

  .composer button:disabled { opacity: .5; cursor: default; }

  :where(button, input, [tabindex]):focus-visible {
    outline: 3px solid var(--work);
    outline-offset: 2px;
  }

  .note {
    font-size: 12px;
    color: var(--text-dim);
    padding: 0 calc(var(--step) * 4) calc(var(--step) * 2);
    background: var(--surface-2);
  }

  .note[data-kind="error"] { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    .log { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }


</style>
</head>
<body>

<div class="app">
<header class="rail" id="rail" data-state="idle">
  <h1 class="title" id="title">Agent chat</h1>
  <span class="sep" aria-hidden="true"></span>
  <span class="dot" aria-hidden="true"></span>
  <span class="what" id="rail-what">Connecting</span>
  <span id="rail-detail">reading the queue…</span>
  <span class="meta" id="rail-meta"></span>
</header>

<main class="log" id="log" aria-live="polite" aria-label="Conversation">
  <div class="empty" id="empty">
    <p class="empty-lead">Nothing yet.</p>
    <p>Type below and the agent picks it up the next time it waits — a wait costs nothing, so an answer is usually quick.</p>
    <ul class="empty-facts">
      <li><span class="k">Queued</span> the agent has not read it yet</li>
      <li><span class="k">Waiting on you</span> the queue is empty</li>
    </ul>
  </div>
</main>

<form class="composer" id="form" autocomplete="off">
  <input id="text" name="text" placeholder="Type to the agent…" aria-label="Message to the agent" enterkeyhint="send" required>
  <button type="submit" id="send">Send</button>
  <button type="button" class="quiet" id="clear" title="Delete the conversation on both sides">Clear</button>
</form>
<p class="note" id="note" role="status"></p>
</div>

<script>
(() => {
  "use strict";

  const rail = document.getElementById("rail");
  const railWhat = document.getElementById("rail-what");
  const railDetail = document.getElementById("rail-detail");
  const railMeta = document.getElementById("rail-meta");
  const log = document.getElementById("log");
  const app = document.querySelector(".app");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  const send = document.getElementById("send");
  const clearBtn = document.getElementById("clear");
  const note = document.getElementById("note");

  let lastRender = "";
  let seen = 0;
  let stick = true;

  const say = (text, kind) => {
    note.textContent = text || "";
    note.dataset.kind = kind || "";
  };

  const hhmm = (ts) => {
    if (!ts) return "";
    const d = new Date(ts < 1e11 ? ts * 1000 : ts);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };

  function render(messages) {
    // Re-render only when the content actually changed: rebuilding the list
    // every poll would kill text selection and reset the scroll.
    const key = messages.map(m => (m.id || "") + "|" + (m.text || "")).join("\u0001");
    // Set the layout flag before the change check: with no messages the key is
    // "" on the first render, so an early return left the panel full-height and
    // empty forever — which is exactly the void the gate caught.
    app.dataset.hasMessages = messages.length > 0 ? "true" : "false";
    empty.hidden = messages.length > 0;
    if (key === lastRender) return;
    lastRender = key;

    const near = log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
    if (near) stick = true;

    for (const el of [...log.querySelectorAll(".row")]) el.remove();
    for (const m of messages) {
      const row = document.createElement("div");
      row.className = "row " + (m.from === "human" ? "you" : "agent");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = m.text || "";
      const stamp = document.createElement("span");
      stamp.className = "stamp";
      stamp.textContent = hhmm(m.ts);
      row.append(bubble, stamp);
      log.append(row);
    }

    if (stick) log.scrollTop = log.scrollHeight;
    seen = messages.length;
  }

  function renderState(s) {
    if (s.unread) {
      rail.dataset.state = "queued";
      railWhat.textContent = "Not read yet";
      railDetail.textContent = "the agent picks it up on its next wait";
    } else {
      rail.dataset.state = "waiting";
      railWhat.textContent = "Waiting on you";
      railDetail.textContent = "an answer is one wait away";
    }
    railMeta.textContent = s.unread ? `${s.size - s.cursor} B queued` : "queue empty";
  }

  // ---- push, not poll ----------------------------------------------------
  // One EventSource, held open. The server writes only when the queue actually
  // changes, so an idle page costs nothing: no timer, no request, no wakeups.
  function connect() {
    const source = new EventSource("/api/events");

    source.onmessage = (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      renderState(data);
      render(data.messages || []);
      if (note.dataset.kind === "error") say("");
      if (rail.dataset.state !== "offline") return;
      rail.dataset.state = "waiting";
    };

    source.onerror = () => {
      // EventSource reconnects on its own; say so rather than pretending all is
      // well, and do not start a timer to "retry" — that is polling again.
      if (source.readyState === EventSource.CLOSED) {
        rail.dataset.state = "idle";
        railWhat.textContent = "Not connected";
        railDetail.textContent = "reconnecting…";
        say("Lost the connection to the agent's queue; retrying.", "error");
      }
    };

    return source;
  }

  let stream = connect();
  // A hidden tab needs nothing, and the browser throttles it anyway. On return,
  // the stream is already there; if it died while hidden, reopen it.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && stream.readyState === EventSource.CLOSED) {
      stream = connect();
    }
  });

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    send.disabled = true;
    try {
      const res = await fetch("/api/send", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || ("http " + res.status));
      }
      input.value = "";
      stick = true;
      say("queued — the agent gets it when it waits");
    } catch (e) {
      say("Not sent: " + e.message, "error");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  clearBtn.addEventListener("click", async () => {
    if (!confirm("Delete the conversation on both sides? One archive is kept.")) return;
    try {
      const res = await fetch("/api/clear", { method: "POST" });
      if (!res.ok) throw new Error("http " + res.status);
      const body = await res.json();
      lastRender = "";
      render([]);
      say(body.archive ? "Cleared — archived " + body.archive : "Cleared");
    } catch (e) {
      say("Not cleared: " + e.message, "error");
    }
  });

  log.addEventListener("scroll", () => {
    stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
  });

  input.focus();
})();
</script>
</body>
</html>
