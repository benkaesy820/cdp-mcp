[package]
name = "cdp-mcp"
version = "0.16.0"
edition = "2021"
description = "A tiny MCP server that drives your own Chromium browser over the DevTools protocol."
license = "MIT"
repository = "https://github.com/benkaesy/cdp-mcp"

[[bin]]
name = "cdp-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tungstenite = "0.27"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[features]
# Off by default. Enables the one option a careful deployment should not need:
# a non-loopback CDP endpoint. See README, Security.
experimental = []
